name: macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            macho: arm64
          - os: macos-15-intel
            arch: x64
            macho: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:pure
      - name: Test application
        run: TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)" npm test
      - name: Exercise saved questions in Electron
        timeout-minutes: 4
        env:
          DEBUG: pw:api
        run: node tests/question-history-electron.cjs
      - name: Build macOS disk image
        run: npx --no-install electron-builder --mac dmg --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify disk image and executable architecture
        run: |
          hdiutil verify dist/*.dmg
          bin=$(find dist -path '*/CoSight.app/Contents/MacOS/CoSight' -print -quit)
          lipo "$bin" -verify_arch "${{ matrix.macho }}"
          cp dist/*.dmg "CoSight-mac-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: CoSight-mac-${{ matrix.arch }}
          path: CoSight-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish Mac downloads
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum CoSight-mac-arm64.dmg CoSight-mac-x64.dmg > SHA256SUMS.txt
          gh release create "$TAG" --verify-tag --title "CoSight ${TAG#v}" --notes "Mac installers for Apple Silicon and Intel. These builds are unsigned." CoSight-mac-arm64.dmg CoSight-mac-x64.dmg SHA256SUMS.txt
